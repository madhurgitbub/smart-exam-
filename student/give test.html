<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take Test</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Vz9PZQF11BtbT5F01FJFiWuggMLjt3E1W3+E3ZwF+V8x+fdCjTBQHn0aczYXMdTa8QBuN0PpbDyXlP6LlXk8Hg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --bg: #0b1220;
            --panel: rgba(255, 255, 255, 0.08);
            --panel-border: rgba(255, 255, 255, 0.16);
            --text: #ebf2ff;
            --muted: rgba(235, 242, 255, 0.7);
            --primary: #0d6efd;
            --primary-2: #6610f2;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, rgba(13, 110, 253, 0.45), transparent 55%),
                linear-gradient(180deg, #081427 0%, #060a11 100%);
            color: var(--text);
            overflow: hidden;
        }

        header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            background: rgba(7, 11, 23, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-weight: 600;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 999px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
        }

        main {
            padding: 32px 24px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .page-title h1 {
            margin: 0;
            font-size: 2.1rem;
        }

        .subtitle {
            margin: 10px 0 24px;
            color: var(--muted);
            max-width: 620px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(14px);
            margin-top: 32px;
        }

        .test-card {
            display: grid;
            gap: 18px;
            grid-template-columns: 1fr auto;
            align-items: center;
        }

        .test-card h3 {
            margin: 0;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 999px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 14px 30px rgba(9, 101, 212, 0.35);
        }

        .btn.primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(9, 101, 212, 0.4);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .btn.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.14);
        }

        .exam-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            height: 100%;
        }

        .exam-main {
            display: flex;
            flex-direction: column;
        }

        .exam-header {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 18px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-title {
            flex: 1;
        }

        .exam-title h2 {
            margin: 0 0 5px;
            font-size: 1.4rem;
        }

        .exam-subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .exam-meta {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .exam-meta-item {
            text-align: right;
        }

        .exam-meta-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .exam-meta-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .timer {
            font-size: 1.8rem;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }

        .timer.warning {
            color: #ffb700;
        }

        .timer.critical {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .question-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .question-marks {
            display: inline-block;
            background: rgba(13, 110, 253, 0.2);
            color: #0d6efd;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 8px;
            font-weight: 600;
        }

        .choices {
            display: grid;
            gap: 12px;
            flex: 1;
        }

        label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        label:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
        }

        label input[type="radio"]:checked ~ span {
            color: #0d6efd;
            font-weight: 600;
        }

        label input[type="radio"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        .option-letter {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .navigation {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .nav-group {
            display: flex;
            gap: 12px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            margin: 0 0 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .question-btn {
            aspect-ratio: 1;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .question-btn.answered {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
        }

        .question-btn.current {
            background: rgba(13, 110, 253, 0.3);
            border-color: #0d6efd;
            color: #0d6efd;
        }

        .question-btn.review {
            background: rgba(255, 183, 0, 0.2);
            border-color: #ffb700;
            color: #ffb700;
        }

        .status-info {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            margin-top: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.answered {
            background: #4caf50;
        }

        .status-dot.unanswered {
            background: rgba(255, 255, 255, 0.3);
        }

        .status-dot.review {
            background: #ffb700;
        }

        .exam-instructions {
            background: rgba(255, 193, 7, 0.15);
            border-left: 4px solid #ffb700;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .exam-instructions strong {
            color: #ffb700;
        }

        .empty-state {
            padding: 48px;
            text-align: center;
            color: var(--muted);
        }

        .empty-state h2 {
            margin: 0 0 12px;
            font-size: 1.7rem;
        }

        @media (max-width: 1024px) {
            .exam-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 200px;
            }

            .question-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (max-width: 720px) {
            main {
                padding: 16px;
            }

            .exam-container {
                grid-template-columns: 1fr;
            }

            .exam-header {
                flex-direction: column;
                text-align: center;
            }

            .exam-meta {
                justify-content: center;
            }

            .question-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .sidebar {
                display: none;
            }

            .timer {
                font-size: 1.4rem;
                min-width: auto;
            }
        }
    </style>
    <script src="../../js/config.js"></script>
    <script src="../../js/exam-utils.js"></script>
    <script src="../../js/auth-service.js"></script>
    <script src="../../js/exam-service.js"></script>
    <script src="../../js/result-service.js"></script>
    <script src="../../js/anticheat-system.js"></script>
</head>
<body>

<header>
    <a href="studenthome.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to dashboard</a>
    <div class="brand">Smart Exam Platform</div>
</header>

<main>
    <div class="page-title">
        <div>
            <h1>Choose an exam</h1>
            <p class="subtitle">Select a test uploaded by your teacher, answer the questions, and see your results instantly.</p>
        </div>
    </div>

    <div id="mainContent"></div>
</main>


<script>
    // ===================================
    // STATE MANAGEMENT
    // ===================================
    let currentExamId = null;
    let currentAttemptId = null;
    let examData = null;
    let currentQuestionIndex = 0;
    let answers = {};
    let markedForReview = new Set();
    let timerInterval = null;
    let antiCheatSystem = null;
    let startTime = null;
    let examDurationSeconds = 0;
    let examDeadlineMs = 0;
    let expectedExamCode = '';
    let antiCheatSystemInstance = null;
    let savingAnswers = false;
    let answerSaveQueue = {};
    const mainContent = document.getElementById('mainContent');

    // Debounced answer save function (1 second delay)
    const debouncedSaveAnswer = ExamUtils.debounce(async (questionId, answer) => {
        if (savingAnswers) return;
        savingAnswers = true;
        
        try {
            const result = await resultService.saveAnswer(currentAttemptId, questionId, answer);
            if (result.success) {
                const saveIndicator = document.getElementById('save-indicator');
                if (saveIndicator) {
                    saveIndicator.textContent = '✓ Saved';
                    saveIndicator.style.color = '#4caf50';
                    setTimeout(() => {
                        if (saveIndicator) saveIndicator.textContent = 'Saving...';
                    }, 1000);
                }
            }
        } catch (error) {
            console.error('Save answer error:', error);
            ExamUtils.showToast('Failed to save answer', 'error');
        } finally {
            savingAnswers = false;
        }
    }, 1000);

    // ===================================
    // INITIALIZATION
    // ===================================
    async function initPage() {
        ExamUtils.showLoader('Loading exams...');
        
        try {
            const isAuth = await authService.isAuthenticated();
            if (!isAuth) {
                ExamUtils.hideLoader();
                ExamUtils.showToast('Please log in to continue', 'error');
                window.location.href = 'student.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const examIdFromUrl = urlParams.get('exam_id');
            expectedExamCode = (urlParams.get('exam_code') || '').trim().toUpperCase();

            if (examIdFromUrl) {
                await startExam(examIdFromUrl, expectedExamCode);
                ExamUtils.hideLoader();
                return;
            }
            
            await renderExamList();
            ExamUtils.hideLoader();
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Init error:', error);
            ExamUtils.showToast('Failed to load exams', 'error');
        }
    }

    // ===================================
    // EXAM LIST VIEW
    // ===================================
    async function renderExamList() {
        try {
            const exams = await examService.getAvailableExams();
            
            if (!exams || exams.length === 0) {
                mainContent.innerHTML = `
                    <div class="card empty-state">
                        <h2>No exams available</h2>
                        <p>No exams are currently available. Check back later or ask your teacher.</p>
                    </div>
                `;
                return;
            }

            const list = document.createElement('div');
            list.className = 'card';
            list.innerHTML = exams.map(exam => `
                <div class="test-card">
                    <div>
                        <h3>${exam.title}</h3>
                        <p class="subtitle">${exam.subject} · ${exam.total_marks} marks · ${exam.duration_minutes} min</p>
                        ${exam.instructions ? `<p style="margin: 8px 0; font-size: 0.9rem; color: var(--muted);">${exam.instructions.substring(0, 100)}...</p>` : ''}
                    </div>
                    <button class="btn primary" data-exam-id="${exam.id}">
                        <i class="fa-solid fa-play"></i> Take exam
                    </button>
                </div>
            `).join('');

            mainContent.innerHTML = '';
            mainContent.appendChild(list);

            list.querySelectorAll('button').forEach(btn => {
                btn.onclick = async () => {
                    const examCode = window.prompt('Enter the exam code provided by your teacher:');
                    if (examCode === null) return;
                    await startExam(btn.dataset.examId, examCode);
                };
            });
        } catch (error) {
            console.error('Render exam list error:', error);
            ExamUtils.showToast('Failed to load exams', 'error');
        }
    }

    // ===================================
    // START EXAM
    // ===================================
    async function startExam(examId, examCodeFromUrl = '') {
        try {
            ExamUtils.showLoader('Starting exam...');
            
            // Load exam details
            examData = await examService.getExamDetails(examId);
            if (!examData) {
                ExamUtils.hideLoader();
                ExamUtils.showToast('Failed to load exam', 'error');
                return;
            }

            if (examData.exam_code && examCodeFromUrl.trim().toUpperCase() !== String(examData.exam_code).trim().toUpperCase()) {
                ExamUtils.hideLoader();
                ExamUtils.showToast('Invalid exam code', 'error');
                window.location.href = 'studenthome.html';
                return;
            }

            // Check if student can attempt
            const canAttempt = await examService.canAttemptExam(examId, (await authService.getCurrentUser()).id);
            if (!canAttempt) {
                ExamUtils.hideLoader();
                ExamUtils.showToast('You have already attempted this exam', 'error');
                return;
            }

            // Show instructions before starting
            const confirmed = await ExamUtils.confirm(
                'Exam Instructions',
                `${examData.instructions || 'Please read the exam instructions carefully before proceeding.'}\n\nDuration: ${examData.duration_minutes} minutes\nTotal Marks: ${examData.total_marks}`,
                'Start Exam',
                'Cancel'
            );

            if (!confirmed) {
                ExamUtils.hideLoader();
                return;
            }

            // Start attempt
            const result = await resultService.startAttempt(examId);
            if (!result.success) {
                ExamUtils.hideLoader();
                ExamUtils.showToast('Failed to start exam attempt', 'error');
                return;
            }

            currentExamId = examId;
            currentAttemptId = result.attempt.id;
            currentQuestionIndex = 0;
            answers = {};
            markedForReview.clear();
            startTime = Date.now();
            examDurationSeconds = examData.duration_minutes * 60;
            examDeadlineMs = examData.end_time
                ? new Date(examData.end_time).getTime()
                : startTime + examDurationSeconds * 1000;

            // Initialize anti-cheat system
            antiCheatSystemInstance = new AntiCheatSystem();
            antiCheatSystemInstance.initializeForExam(currentAttemptId);

            // Setup page navigation warnings
            setupNavigationWarnings();

            ExamUtils.hideLoader();
            renderExam();
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Start exam error:', error);
            ExamUtils.showToast('Failed to start exam', 'error');
        }
    }

    // ===================================
    // EXAM RENDERING
    // ===================================
    function renderExam() {
        if (currentQuestionIndex >= examData.questions.length) {
            renderSubmitConfirm();
            return;
        }

        const question = examData.questions[currentQuestionIndex];
        const isAnswered = answers.hasOwnProperty(question.id);
        const isReview = markedForReview.has(question.id);

        mainContent.innerHTML = `
            <div class="exam-container">
                <div class="exam-main">
                    <!-- Exam Header -->
                    <div class="exam-header">
                        <div class="exam-title">
                            <h2>${examData.title}</h2>
                            <p class="exam-subtitle">${examData.subject} · Question ${currentQuestionIndex + 1} of ${examData.questions.length}</p>
                        </div>
                        <div class="exam-meta">
                            <div class="exam-meta-item">
                                <div class="exam-meta-label">Total Marks</div>
                                <div class="exam-meta-value">${examData.total_marks}</div>
                            </div>
                            <div class="exam-meta-item">
                                <div id="timer" class="timer">--:--:--</div>
                                <div class="exam-meta-label">Time Left</div>
                            </div>
                        </div>
                    </div>

                    <!-- Question Section -->
                    <div class="question-section">
                        ${examData.instructions ? `
                            <div class="exam-instructions">
                                <strong>Instructions:</strong> ${examData.instructions}
                            </div>
                        ` : ''}

                        <div class="question-text">
                            <strong>Q${currentQuestionIndex + 1}.</strong> ${question.question_text}
                            <span class="question-marks">${question.marks || 1} mark${(question.marks || 1) !== 1 ? 's' : ''}</span>
                        </div>

                        <div class="choices">
                            ${['option_a', 'option_b', 'option_c', 'option_d'].map((opt, idx) => {
                                const optionLetter = String.fromCharCode(65 + idx);
                                const isSelected = answers[question.id] === optionLetter;
                                return `
                                    <label>
                                        <input 
                                            type="radio" 
                                            name="answer" 
                                            value="${optionLetter}"
                                            ${isSelected ? 'checked' : ''}
                                            onchange="handleAnswerChange('${question.id}', this.value)"
                                        >
                                        <div class="option-letter">${optionLetter}</div>
                                        <span>${question[opt]}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>

                        <div style="margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                            <button class="btn secondary" onclick="toggleReview(${currentQuestionIndex})" style="flex: 1;">
                                <i class="fa-solid fa-bookmark"></i> ${isReview ? 'Remove from Review' : 'Mark for Review'}
                            </button>
                            <div id="save-indicator" style="color: var(--muted); font-size: 0.9rem; margin-left: auto;">Saving...</div>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="navigation">
                        <div class="nav-group">
                            <button class="btn secondary" onclick="previousQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                                <i class="fa-solid fa-arrow-left"></i> Previous
                            </button>
                            <button class="btn secondary" onclick="skipToNext()">
                                Skip <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                        <div class="nav-group">
                            ${currentQuestionIndex < examData.questions.length - 1 ? `
                                <button class="btn primary" onclick="nextQuestion()">
                                    Next <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            ` : `
                                <button class="btn primary" onclick="renderSubmitConfirm()">
                                    Review & Submit <i class="fa-solid fa-flag-checkered"></i>
                                </button>
                            `}
                        </div>
                    </div>
                </div>

                <!-- Sidebar: Question Navigation -->
                <div class="sidebar">
                    <div class="sidebar-title">Questions</div>
                    <div class="question-grid">
                        ${examData.questions.map((q, idx) => {
                            const qAnswered = answers.hasOwnProperty(q.id);
                            const qReview = markedForReview.has(q.id);
                            let btnClass = 'question-btn';
                            if (idx === currentQuestionIndex) btnClass += ' current';
                            else if (qReview) btnClass += ' review';
                            else if (qAnswered) btnClass += ' answered';
                            
                            return `<button class="${btnClass}" onclick="jumpToQuestion(${idx})" title="Question ${idx + 1}">${idx + 1}</button>`;
                        }).join('')}
                    </div>

                    <div class="status-info">
                        <div class="sidebar-title">Status</div>
                        <div class="status-item">
                            <div class="status-dot answered"></div>
                            <span>Answered</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot unanswered"></div>
                            <span>Not Answered</span>
                        </div>
                        <div class="status-item">
                            <div class="status-dot review"></div>
                            <span>Review</span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        startTimer();
    }

    // ===================================
    // ANSWER MANAGEMENT
    // ===================================
    function handleAnswerChange(questionId, answer) {
        answers[questionId] = answer;
        markedForReview.delete(questionId);
        
        // Show saving indicator
        const saveIndicator = document.getElementById('save-indicator');
        if (saveIndicator) {
            saveIndicator.textContent = 'Saving...';
            saveIndicator.style.color = 'var(--muted)';
        }

        // Save answer with debounce
        debouncedSaveAnswer(questionId, answer);
        
        // Save to localStorage as backup
        localStorage.setItem(`exam_${currentAttemptId}_answers`, JSON.stringify(answers));
    }

    function toggleReview(index) {
        const question = examData.questions[index];
        if (markedForReview.has(question.id)) {
            markedForReview.delete(question.id);
        } else {
            markedForReview.add(question.id);
        }
        
        ExamUtils.showToast(
            markedForReview.has(question.id) ? 'Marked for review' : 'Removed from review',
            'info'
        );
        
        renderExam();
    }

    // ===================================
    // NAVIGATION
    // ===================================
    function nextQuestion() {
        if (currentQuestionIndex < examData.questions.length - 1) {
            currentQuestionIndex++;
            renderExam();
        }
    }

    function previousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderExam();
        }
    }

    function skipToNext() {
        nextQuestion();
    }

    function jumpToQuestion(index) {
        currentQuestionIndex = index;
        renderExam();
    }

    // ===================================
    // TIMER
    // ===================================
    function startTimer() {
        clearInterval(timerInterval);
        
        const updateTimer = () => {
            const now = Date.now();
            const remaining = Math.max(0, Math.floor((examDeadlineMs - now) / 1000));
            const formatted = ExamUtils.formatDuration(remaining);
            
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.textContent = formatted;
                timerEl.className = 'timer';
                
                // Color warnings
                if (remaining <= 60) {
                    timerEl.classList.add('critical');
                    if (remaining === 60) {
                        ExamUtils.showToast('⏰ Only 1 minute remaining!', 'warning');
                    }
                } else if (remaining <= 300) {
                    timerEl.classList.add('warning');
                    if (remaining === 300) {
                        ExamUtils.showToast('⏰ 5 minutes remaining', 'warning');
                    }
                }
            }
            
            if (remaining === 0) {
                clearInterval(timerInterval);
                examDeadlineMs = 0;
                autoSubmitExam('Time limit exceeded');
            }
        };
        
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    // ===================================
    // SUBMIT CONFIRMATION
    // ===================================
    function renderSubmitConfirm() {
        clearInterval(timerInterval);
        examDeadlineMs = 0;
        
        const answered = Object.keys(answers).length;
        const total = examData.questions.length;
        const unanswered = total - answered;

        mainContent.innerHTML = `
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="card">
                    <div style="text-align: center; margin-bottom: 32px;">
                        <i class="fa-solid fa-check-circle" style="font-size: 3rem; color: #4caf50; margin-bottom: 16px;"></i>
                        <h2 style="margin: 0 0 8px;">Ready to Submit?</h2>
                        <p style="color: var(--muted); margin: 0;">Review your answers before final submission</p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 24px 0;">
                        <div style="background: rgba(76, 175, 80, 0.15); border-left: 4px solid #4caf50; padding: 16px; border-radius: 6px;">
                            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;">Answered</div>
                            <div style="font-size: 1.8rem; color: #4caf50; font-weight: bold;">${answered}/${total}</div>
                        </div>
                        <div style="background: rgba(244, 67, 54, 0.15); border-left: 4px solid #f44336; padding: 16px; border-radius: 6px;">
                            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 8px;">Unanswered</div>
                            <div style="font-size: 1.8rem; color: #f44336; font-weight: bold;">${unanswered}</div>
                        </div>
                    </div>

                    ${unanswered > 0 ? `
                        <div style="background: rgba(255, 193, 7, 0.15); border-left: 4px solid #ffb700; padding: 12px 16px; border-radius: 6px; margin: 16px 0;">
                            <p style="margin: 0; color: #ffb700; font-size: 0.9rem;">
                                <strong>⚠️ Warning:</strong> You have ${unanswered} unanswered question${unanswered !== 1 ? 's' : ''}.
                            </p>
                        </div>
                    ` : ''}

                    <div style="background: rgba(255, 255, 255, 0.08); padding: 16px; border-radius: 12px; margin: 20px 0;">
                        <p style="margin: 0; color: var(--muted); font-size: 0.9rem;">
                            Once you submit, you cannot change your answers. Your exam will be evaluated and results will be available shortly.
                        </p>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button class="btn secondary" onclick="goBackToExam()" style="flex: 1;">
                            <i class="fa-solid fa-arrow-left"></i> Go Back
                        </button>
                        <button class="btn primary" onclick="submitExam()" style="flex: 1;">
                            <i class="fa-solid fa-check"></i> Submit Exam
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function goBackToExam() {
        renderExam();
    }

    // ===================================
    // SUBMIT EXAM
    // ===================================
    async function submitExam() {
        try {
            ExamUtils.showLoader('Submitting your exam...');
            
            // Stop anti-cheat system
            if (antiCheatSystemInstance) {
                antiCheatSystemInstance.endExam?.();
            }
            
            clearInterval(timerInterval);
            examDeadlineMs = 0;

            const timeTaken = Math.floor((Date.now() - startTime) / 1000);
            const result = await resultService.submitExam(currentAttemptId, timeTaken);
            
            ExamUtils.hideLoader();

            if (result.success) {
                ExamUtils.showToast('✓ Exam submitted successfully!', 'success');
                
                // Clear localStorage backup
                localStorage.removeItem(`exam_${currentAttemptId}_answers`);
                
                setTimeout(() => {
                    window.location.href = `result.html?attemptId=${currentAttemptId}`;
                }, 500);
            } else {
                ExamUtils.showToast('Failed to submit exam', 'error');
            }
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Submit exam error:', error);
            ExamUtils.showToast('Failed to submit exam', 'error');
        }
    }

    // ===================================
    // AUTO-SUBMIT (For anti-cheat violations & timeout)
    // ===================================
    async function autoSubmitExam(reason) {
        try {
            if (antiCheatSystemInstance) {
                antiCheatSystemInstance.stop?.();
            }
            
            clearInterval(timerInterval);
            examDeadlineMs = 0;
            ExamUtils.showLoader(`Auto-submitting exam: ${reason}`);
            
            const result = await resultService.autoSubmitExam(currentAttemptId, reason);
            
            ExamUtils.hideLoader();
            
            ExamUtils.showToast(`Exam auto-submitted: ${reason}`, 'warning');
            
            setTimeout(() => {
                window.location.href = `result.html?attemptId=${currentAttemptId}`;
            }, 1000);
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Auto-submit error:', error);
            ExamUtils.showToast('Error submitting exam', 'error');
        }
    }

    // ===================================
    // PAGE NAVIGATION WARNINGS
    // ===================================
    function setupNavigationWarnings() {
        // Prevent browser back button
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', (e) => {
            e.preventDefault();
            ExamUtils.showToast('Cannot navigate away from exam', 'error');
            window.history.pushState(null, null, window.location.href);
        });

        // Warn on page reload
        window.addEventListener('beforeunload', (e) => {
            if (currentAttemptId) {
                e.preventDefault();
                e.returnValue = 'Are you sure you want to leave? Your exam progress will be lost.';
                return e.returnValue;
            }
        });
    }

    // ===================================
    // INITIALIZATION
    // ===================================
    document.addEventListener('DOMContentLoaded', initPage);
</script>
</body>
</html>
