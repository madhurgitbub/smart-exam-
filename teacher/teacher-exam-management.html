<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - Teacher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #060a11;
            --nav-bg: rgba(11, 18, 32, 0.8);
            --panel: rgba(255, 255, 255, 0.05);
            --text: #ebf2ff;
            --text-muted: #94a3b8;
            --primary: #2563eb; 
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b1220;
            color: var(--text);
        }

        /* Top Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #111827;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .nav-left a:hover { color: var(--text); }

        .nav-right { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; }
        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 30px; }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: 0.2s;
        }

        .btn-primary:hover { transform: none; opacity: 0.92; }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 30px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: white;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95rem;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 15px;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }

        td {
            padding: 18px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .btn-action {
            background: rgba(255,255,255,0.15);
            color: white;
            border-radius: 8px;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-right: 8px;
            transition: background 0.2s ease;
        }

        .btn-action:hover { background: rgba(255,255,255,0.22); }

        .btn-danger {
            background: rgba(244, 67, 54, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .btn-danger:hover {
            background: rgba(244, 67, 54, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid;
        }

        .status-draft {
            background: rgba(229, 231, 235, 0.1);
            color: #d1d5db;
            border-color: rgba(209, 213, 219, 0.3);
        }

        .status-scheduled {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .status-closed {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; place-items: center; z-index: 1000; }
        .modal-content { 
            background: #111827; 
            padding: 30px; 
            border-radius: 16px; 
            width: 90%; 
            max-width: 600px; 
            max-height: 80vh; 
            border: 1px solid #334155; 
            overflow-y: auto; 
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.5rem;
        }

        .questions-list {
            margin-top: 20px;
        }

        .question-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 3px solid var(--primary);
        }

        .question-item p {
            margin: 5px 0;
            color: var(--text-muted);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<nav class="nav-bar">
    <div class="nav-left">
        <a href="teacher home .html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>
    <div class="nav-right">
        <i class="fa-solid fa-chalkboard-user"></i> Exam Management
    </div>
</nav>

<div class="container">
    <h1>Manage Your Exams</h1>
    <p class="subtitle">Create, edit, and publish exams for your students.</p>
    
    <!-- Create/Edit Exam Form -->
    <div class="card">
        <h2 id="formTitle">Create New Exam</h2>
        <form id="examForm">
            <input type="hidden" id="examId" name="examId">
            
            <div class="form-row">
                <label>
                    Exam Title *
                    <input type="text" name="title" placeholder="e.g., Midterm Mathematics" required>
                </label>
                <label>
                    Subject *
                    <input type="text" name="subject" placeholder="e.g., Mathematics" required>
                </label>
            </div>

            <label>
                Description
                <textarea name="description" placeholder="Exam description and instructions..." rows="3"></textarea>
            </label>

            <div class="form-row">
                <label>
                    Total Marks *
                    <input type="number" name="total_marks" min="1" placeholder="100" required>
                </label>
                <label>
                    Duration (minutes) *
                    <input type="number" name="duration_minutes" min="1" placeholder="60" required>
                </label>
            </div>

            <div class="form-row">
                <label>
                    Start Time *
                    <input type="datetime-local" name="start_time" required>
                </label>
                <label>
                    End Time *
                    <input type="datetime-local" name="end_time" required>
                </label>
            </div>

            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn-primary">Save Exam</button>
                <button type="button" id="cancelBtn" class="btn-action" style="background: rgba(255,255,255,0.08);">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Exams List -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 40px; margin-bottom: 20px;">
        <h2 style="margin:0">Your Exams</h2>
        <button class="btn-primary" onclick="document.getElementById('examForm').reset(); document.getElementById('examId').value = ''; document.getElementById('formTitle').textContent = 'Create New Exam';">+ New Exam</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Subject</th>
                <th>Code</th>
                <th>Status</th>
                <th>Marks</th>
                <th>Duration</th>
                <th>Start Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="examsTable">
            <tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">Loading exams...</td></tr>
        </tbody>
    </table>
</div>

<!-- Questions Modal -->
<div id="questionsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin: 0;">Add Questions</h3>
            <button class="modal-close" onclick="closeQuestionModal()">&times;</button>
        </div>

        <form id="questionForm">
            <input type="hidden" id="currentExamId">
            
            <label>
                Question Text *
                <textarea name="question_text" placeholder="Enter the question..." rows="3" required></textarea>
            </label>

            <label>
                Option A *
                <input type="text" name="option_a" placeholder="Option A" required>
            </label>

            <label>
                Option B *
                <input type="text" name="option_b" placeholder="Option B" required>
            </label>

            <label>
                Option C *
                <input type="text" name="option_c" placeholder="Option C" required>
            </label>

            <label>
                Option D *
                <input type="text" name="option_d" placeholder="Option D" required>
            </label>

            <label>
                Correct Answer *
                <select name="correct_answer" required>
                    <option value="">Select correct option</option>
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
            </label>

            <label>
                Marks *
                <input type="number" name="marks" min="1" placeholder="1" required>
            </label>

            <button type="submit" class="btn-primary">Add Question</button>
        </form>

        <div class="questions-list" id="questionsList"></div>
    </div>
</div>

<script src="../../js/config.js" defer></script>
<script src="../../js/exam-utils.js" defer></script>
<script src="../../js/auth-service.js" defer></script>
<script src="../../js/exam-service.js" defer></script>
<script>
    let currentExamId = null;
    let allExams = [];

    document.addEventListener('DOMContentLoaded', async () => {
        // Check authentication
        const isAuthenticated = await authService.isAuthenticated();
        if (!isAuthenticated) {
            window.location.href = 'teacher.html';
            return;
        }

        // Check role
        const role = await authService.getUserRole();
        if (role !== 'teacher') {
            ExamUtils.showToast('Unauthorized access', 'error');
            await authService.logout();
            window.location.href = 'teacher.html';
            return;
        }

        // Ensure teacher profile exists (prevents FK/RLS errors on create)
        const currentUser = await authService.getCurrentUser();
        await authService.ensureProfileExists(currentUser, 'teacher');

        // Load exams
        await loadExams();

        // Form handlers
        document.getElementById('examForm').addEventListener('submit', handleExamSubmit);
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('examForm').reset();
            document.getElementById('examId').value = '';
            document.getElementById('formTitle').textContent = 'Create New Exam';
        });

        document.getElementById('questionForm').addEventListener('submit', handleQuestionSubmit);
    });

    async function loadExams() {
        try {
            const user = await authService.getCurrentUser();
            if (!user) return;

            ExamUtils.showLoader('Loading exams...');
            allExams = await examService.getTeacherExams(user.id);
            ExamUtils.hideLoader();

            renderExams();
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error loading exams: ' + error.message, 'error');
        }
    }

    function renderExams() {
        const table = document.getElementById('examsTable');
        
        if (allExams.length === 0) {
            table.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">No exams created yet. Create one to get started!</td></tr>';
            return;
        }

        table.innerHTML = allExams.map(exam => `
            <tr>
                <td style="font-weight: 600;">${exam.title}</td>
                <td>${exam.subject || '-'}</td>
                <td><code style="background: rgba(255,255,255,0.06); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);">${exam.exam_code || '-'}</code></td>
                <td><span class="status-badge status-${exam.status || 'draft'}">${(exam.status || 'draft').toUpperCase()}</span></td>
                <td>${exam.total_marks || '-'}</td>
                <td>${exam.duration_minutes || '-'} min</td>
                <td>${exam.start_time ? ExamUtils.formatDate(exam.start_time) : '-'}</td>
                <td>
                    <button class="btn-action" onclick="editExam('${exam.id}')"><i class="fa-solid fa-pencil"></i> Edit</button>
                    <button class="btn-action" onclick="openQuestionModal('${exam.id}')"><i class="fa-solid fa-plus"></i> Questions</button>
                    <button class="btn-action" onclick="publishExam('${exam.id}')" ${exam.status === 'draft' ? '' : 'disabled'}><i class="fa-solid fa-paper-plane"></i> Publish</button>
                    <button class="btn-action btn-danger" onclick="deleteExam('${exam.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function handleExamSubmit(e) {
        e.preventDefault();
        
        const formData = new FormData(document.getElementById('examForm'));
        const examId = formData.get('examId');
        
        const examData = {
            title: formData.get('title'),
            subject: formData.get('subject'),
            description: formData.get('description'),
            total_marks: parseInt(formData.get('total_marks')),
            duration_minutes: parseInt(formData.get('duration_minutes')),
            start_time: formData.get('start_time'),
            end_time: formData.get('end_time')
        };

        // Validation
        if (!examData.title.trim()) {
            ExamUtils.showToast('Please enter exam title', 'error');
            return;
        }

        if (new Date(examData.start_time) >= new Date(examData.end_time)) {
            ExamUtils.showToast('End time must be after start time', 'error');
            return;
        }

        ExamUtils.showLoader('Saving exam...');

        try {
            let result;
            if (examId) {
                result = await examService.updateExam(examId, examData);
            } else {
                result = await examService.createExam(examData);
            }

            ExamUtils.hideLoader();

            if (!result.success) {
                ExamUtils.showToast(result.error || 'Failed to save exam', 'error');
                return;
            }

            ExamUtils.showToast(result.message || 'Exam saved successfully', 'success');
            if (result.examCode) {
                ExamUtils.showToast(`Exam code: ${result.examCode}`, 'success');
            }
            document.getElementById('examForm').reset();
            document.getElementById('examId').value = '';
            document.getElementById('formTitle').textContent = 'Create New Exam';
            await loadExams();
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error: ' + error.message, 'error');
        }
    }

    function editExam(examId) {
        const exam = allExams.find(e => e.id === examId);
        if (!exam) return;

        document.getElementById('formTitle').textContent = 'Edit Exam: ' + exam.title;
        document.getElementById('examId').value = exam.id;
        document.querySelector('input[name="title"]').value = exam.title;
        document.querySelector('input[name="subject"]').value = exam.subject || '';
        document.querySelector('textarea[name="description"]').value = exam.description || '';
        document.querySelector('input[name="total_marks"]').value = exam.total_marks || '';
        document.querySelector('input[name="duration_minutes"]').value = exam.duration_minutes || '';
        document.querySelector('input[name="start_time"]').value = exam.start_time ? new Date(exam.start_time).toISOString().slice(0, 16) : '';
        document.querySelector('input[name="end_time"]').value = exam.end_time ? new Date(exam.end_time).toISOString().slice(0, 16) : '';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function publishExam(examId) {
        const confirmed = await ExamUtils.confirm(
            'Publish Exam',
            'Are you sure you want to publish this exam? Published exams cannot be modified.',
            'Yes, Publish',
            'Cancel'
        );

        if (!confirmed) return;

        ExamUtils.showLoader('Publishing exam...');

        try {
            const result = await examService.publishExam(examId);
            ExamUtils.hideLoader();

            if (!result.success) {
                ExamUtils.showToast(result.error || 'Failed to publish exam', 'error');
                return;
            }

            ExamUtils.showToast('Exam published successfully', 'success');
            await loadExams();
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error: ' + error.message, 'error');
        }
    }

    async function deleteExam(examId) {
        const confirmed = await ExamUtils.confirm(
            'Delete Exam',
            'Are you sure you want to delete this exam? This action cannot be undone.',
            'Yes, Delete',
            'Cancel'
        );

        if (!confirmed) return;

        ExamUtils.showLoader('Deleting exam...');

        try {
            const result = await examService.deleteExam(examId);
            ExamUtils.hideLoader();

            if (!result.success) {
                ExamUtils.showToast(result.error || 'Failed to delete exam', 'error');
                return;
            }

            ExamUtils.showToast('Exam deleted successfully', 'success');
            await loadExams();
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error: ' + error.message, 'error');
        }
    }

    async function openQuestionModal(examId) {
        currentExamId = examId;
        document.getElementById('currentExamId').value = examId;
        document.getElementById('questionForm').reset();
        
        // Load existing questions
        await loadQuestions(examId);
        
        document.getElementById('questionsModal').style.display = 'grid';
    }

    function closeQuestionModal() {
        document.getElementById('questionsModal').style.display = 'none';
        currentExamId = null;
    }

    async function loadQuestions(examId) {
        try {
            const questions = await examService.getExamQuestions(examId);
            renderQuestions(questions);
        } catch (error) {
            ExamUtils.showToast('Error loading questions: ' + error.message, 'error');
        }
    }

    function renderQuestions(questions) {
        const list = document.getElementById('questionsList');
        
        if (questions.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No questions added yet.</p>';
            return;
        }

        list.innerHTML = '<h3 style="margin-top: 30px; margin-bottom: 15px;">Questions (' + questions.length + ')</h3>' + 
            questions.map((q, idx) => `
                <div class="question-item">
                    <p><strong>Q${idx + 1}: ${q.question_text}</strong></p>
                    <p>A) ${q.option_a}</p>
                    <p>B) ${q.option_b}</p>
                    <p>C) ${q.option_c}</p>
                    <p>D) ${q.option_d}</p>
                    <p><strong>Correct: Option ${q.correct_answer} | Marks: ${q.marks}</strong></p>
                    <button class="btn-action btn-danger" onclick="deleteQuestion('${q.id}')" style="margin-top: 10px;">Delete Question</button>
                </div>
            `).join('');
    }

    async function handleQuestionSubmit(e) {
        e.preventDefault();

        const formData = new FormData(document.getElementById('questionForm'));
        const questionData = {
            question_text: formData.get('question_text'),
            option_a: formData.get('option_a'),
            option_b: formData.get('option_b'),
            option_c: formData.get('option_c'),
            option_d: formData.get('option_d'),
            correct_answer: formData.get('correct_answer'),
            marks: parseInt(formData.get('marks')) || 1
        };

        // Validation
        if (!questionData.question_text.trim()) {
            ExamUtils.showToast('Please enter question text', 'error');
            return;
        }

        ExamUtils.showLoader('Adding question...');

        try {
            const result = await examService.addQuestion(currentExamId, questionData);
            ExamUtils.hideLoader();

            if (!result.success) {
                ExamUtils.showToast(result.error || 'Failed to add question', 'error');
                return;
            }

            ExamUtils.showToast('Question added successfully', 'success');
            document.getElementById('questionForm').reset();
            await loadQuestions(currentExamId);
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error: ' + error.message, 'error');
        }
    }

    async function deleteQuestion(questionId) {
        const confirmed = await ExamUtils.confirm(
            'Delete Question',
            'Are you sure you want to delete this question?',
            'Yes, Delete',
            'Cancel'
        );

        if (!confirmed) return;

        ExamUtils.showLoader('Deleting question...');

        try {
            const result = await examService.deleteQuestion(questionId);
            ExamUtils.hideLoader();

            if (!result.success) {
                ExamUtils.showToast(result.error || 'Failed to delete question', 'error');
                return;
            }

            ExamUtils.showToast('Question deleted successfully', 'success');
            await loadQuestions(currentExamId);
        } catch (error) {
            ExamUtils.hideLoader();
            ExamUtils.showToast('Error: ' + error.message, 'error');
        }
    }

    // Close modal on background click
    window.onclick = function(event) {
        const modal = document.getElementById('questionsModal');
        if (event.target == modal) closeQuestionModal();
    }
</script>
</body>
</html>
