<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login / Register</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --bg: #0d1117;
            --panel: rgba(255, 255, 255, 0.14);
            --panel-border: rgba(255, 255, 255, 0.18);
            --text: #e9ecef;
            --muted: rgba(233, 236, 239, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, rgba(13, 110, 253, 0.55), transparent 55%),
                linear-gradient(180deg, #07102c 0%, #0a0c12 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
        }

        .card h1 {
            margin: 0 0 10px;
            font-size: 1.85rem;
            letter-spacing: 0.6px;
        }

        .card p.subtitle {
            margin: 0 0 26px;
            color: var(--muted);
        }

        .sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 22px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .panel:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(13, 110, 253, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.15);
        }

        .panel:hover::before {
            left: 100%;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 0.98rem;
            transition: all 0.3s ease;
        }

        input:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.24);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.35);
            border-color: rgba(13, 110, 253, 0.6);
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.01);
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
            z-index: 0;
        }

        .btn > * {
            position: relative;
            z-index: 1;
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 14px 28px rgba(9, 101, 212, 0.35);
        }

        .btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 36px rgba(9, 101, 212, 0.45);
        }

        .btn.primary:hover::before {
            left: 100%;
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 22px;
            font-size: 0.85rem;
            color: rgba(233, 236, 239, 0.65);
            text-align: center;
        }

        .footer a {
            color: rgba(13, 110, 253, 0.9);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 12px;
            }

            .card {
                padding: 26px 18px;
                border-radius: 14px;
            }

            .card h1 {
                font-size: 1.45rem;
            }

            .sections {
                gap: 16px;
            }

            .panel {
                padding: 18px;
                border-radius: 14px;
            }

            .panel h2 {
                font-size: 1.1rem;
            }

            .section-subtitle {
                font-size: 0.9rem;
            }

            label {
                font-size: 0.9rem;
            }

            input {
                padding: 10px 12px;
                font-size: 0.95rem;
            }

            .btn {
                padding: 11px 16px;
                font-size: 0.95rem;
                border-radius: 8px;
            }

            .form-actions {
                gap: 8px;
            }

            .footer {
                font-size: 0.8rem;
                margin-top: 16px;
            }
        }
    </style>
    <link rel="stylesheet" href="../common/theme.css" />
    <script src="../../js/config.js"></script>
    <script src="../../js/exam-utils.js"></script>
    <script src="../../js/auth-service.js"></script>
</head>
<body>

<div class="card" role="main">
    <h1>Student Portal</h1>
    <p class="subtitle">Login to continue or register for a new account.</p>    
    <div class="sections">
        <section class="panel" id="existing">
            <h2>Existing student</h2>
            <p class="section-subtitle">Sign in to access your dashboard.</p>

            <form id="login" autocomplete="off">
                <label>
                    Student Email
                    <input type="email" name="email" placeholder="you@example.com" required />
                </label>
                <label>
                    Password
                    <input type="password" name="password" placeholder="••••••••" required />
                </label>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Login</button>
                    <button class="btn secondary" type="button" id="switchToRegister">Create account</button>
                </div>
            </form>
        </section>

        <section class="panel" id="new">
            <h2>New student</h2>
            <p class="section-subtitle">Register for a new account.</p>

            <form id="register" autocomplete="off">
                <label>
                    Full name
                    <input type="text" name="name" placeholder="Jane Doe" required />
                </label>
                <label>
                    Student ID
                    <input type="text" name="studentId" placeholder="e.g. 2023-001" required />
                </label>
                <label>
                    Email address
                    <input type="email" name="email" placeholder="you@example.com" required />
                </label>
                <label>
                    Password
                    <input type="password" name="password" placeholder="Create a password" required />
                </label>
                <label>
                    Confirm password
                    <input type="password" name="confirm" placeholder="Confirm password" required />
                </label>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Register</button>
                    
                    <button class="btn secondary" type="button" id="switchToLogin">Back to login</button>
                </div>
            </form>
        </section>
        <p class="subtitle"><a class="btn secondary" href="index.html"> <<< Go Back </a></p>
    </div>

    <p class="footer">
        <span>Need help?</span>
        <a href="#" onclick="alert('Contact your administrator for support'); return false;">Contact support</a>
    </p>
</div>

<script>
    // Wait for DOM to be fully loaded and all scripts to load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAuth);
    } else {
        initAuth();
    }
    
    function initAuth() {
        console.log('Initializing auth...', { AuthService: typeof AuthService, ExamUtils: typeof ExamUtils });
        
        // Initialize auth service (use existing singleton if available)
        const authService = window.authService || new AuthService();
        console.log('Auth service initialized:', authService);
        
        // Make it globally available
        window.authService = authService;

        document.getElementById('switchToRegister').addEventListener('click', () => {
            document.getElementById('new').scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('switchToLogin').addEventListener('click', () => {
            document.getElementById('existing').scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('login').addEventListener('submit', async e => {
            e.preventDefault();
            
            ExamUtils.showLoader('Logging in...');
            
            try {
                const email = document.querySelector('#login input[name="email"]').value;
                const password = document.querySelector('#login input[name="password"]').value;
                
                console.log('Login attempt:', email);
                const result = await authService.login(email, password);
                console.log('Login result:', result);
                ExamUtils.hideLoader();
                
                if (result.success) {
                    ExamUtils.showToast('Login successful!', 'success');
                    localStorage.setItem('smartexam_studentName', result.user.user_metadata?.name || email);
                    setTimeout(() => {
                        window.location.href = 'studenthome.html';
                    }, 500);
                } else {
                    ExamUtils.showToast('Login failed: ' + result.error, 'error');
                }
            } catch (err) {
                console.error('Login exception:', err);
                ExamUtils.hideLoader();
                ExamUtils.showToast('Error: ' + err.message, 'error');
            }
        });

        document.getElementById('register').addEventListener('submit', async e => {
            e.preventDefault();
            
            const name = document.querySelector('#register input[name="name"]').value;
            const email = document.querySelector('#register input[name="email"]').value;
            const studentId = document.querySelector('#register input[name="studentId"]').value;
            const password = document.querySelector('#register input[name="password"]').value;
            const confirm = document.querySelector('#register input[name="confirm"]').value;
            
            if (password !== confirm) {
                ExamUtils.showToast('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 8) {
                ExamUtils.showToast('Password must be at least 8 characters', 'error');
                return;
            }
            
            ExamUtils.showLoader('Creating your account...');
            
            try {
                console.log('Signup attempt:', email);
                const result = await authService.signup(email, password, name, 'student', { roll_no: studentId });
                console.log('Signup result:', result);
                ExamUtils.hideLoader();
                
                if (result.success) {
                    ExamUtils.showToast('Registration successful! Please verify your email and login.', 'success');
                    document.getElementById('register').reset();
                    document.getElementById('existing').scrollIntoView({ behavior: 'smooth' });
                } else {
                    ExamUtils.showToast('Registration failed: ' + result.error, 'error');
                }
            } catch (err) {
                console.error('Signup exception:', err);
                ExamUtils.hideLoader();
                ExamUtils.showToast('Error: ' + err.message, 'error');
            }
        });
    }
</script>
</body>
</html>
