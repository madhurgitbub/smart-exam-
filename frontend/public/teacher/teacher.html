<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Login / Register</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --success: #198754;
            --bg: #0d1117;
            --panel: rgba(255, 255, 255, 0.14);
            --panel-border: rgba(255, 255, 255, 0.18);
            --text: #e9ecef;
            --muted: rgba(233, 236, 239, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, rgba(13, 110, 253, 0.55), transparent 55%),
                linear-gradient(180deg, #07102c 0%, #0a0c12 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            width: min(520px, 100%);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
        }

        .card h1 {
            margin: 0 0 10px;
            font-size: 1.85rem;
            letter-spacing: 0.6px;
        }

        .card p.subtitle {
            margin: 0 0 26px;
            color: var(--muted);
        }

        .sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .panel:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(13, 110, 253, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.15);
        }

        .panel:hover::before {
            left: 100%;
        }

        .panel.active {
            background: rgba(13, 110, 253, 0.25);
            border-color: rgba(13, 110, 253, 0.55);
            box-shadow: 0 8px 24px rgba(13, 110, 253, 0.25);
        }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 1.25rem;
            color: var(--text);
        }

        .section-subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        input,
        select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        input::placeholder {
            color: rgba(233, 236, 239, 0.5);
        }

        input:hover,
        select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.28);
        }

        input:focus,
        select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(13, 110, 253, 0.55);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.25);
            transform: scale(1.01);
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group.full {
            grid-template-columns: 1fr;
        }

        button {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #0856ca);
            color: white;
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.35);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(13, 110, 253, 0.45);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .link {
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .link:hover {
            color: #0856ca;
        }

        .footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            font-size: 0.92rem;
            color: var(--muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff8b9e;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            display: none;
            animation: slideInDown 0.3s ease;
        }

        .error-msg.show {
            display: block;
            animation: slideInDown 0.3s ease;
        }

        @keyframes slideInDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 12px;
            }

            .card {
                padding: 24px 18px;
                border-radius: 14px;
            }

            .sections {
                gap: 16px;
            }

            .card h1 {
                font-size: 1.5rem;
            }

            label {
                font-size: 0.9rem;
            }

            .btn-primary {
                padding: 11px 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 8px;
            }

            .card {
                padding: 20px 14px;
                border-radius: 12px;
            }

            .card h1 {
                font-size: 1.35rem;
            }

            .card p.subtitle {
                font-size: 0.9rem;
            }

            .panel h2 {
                font-size: 1.1rem;
            }

            .form-group {
                grid-template-columns: 1fr !important;
            }

            button {
                padding: 11px 16px;
                font-size: 0.95rem;
            }
        }
    </style>
    <link rel="stylesheet" href="../common/theme.css" />
    <script src="../../js/config.js" defer></script>
    <script src="../../js/exam-utils.js"></script>
    <script src="../../js/auth-service.js"></script>
</head>
<body>

<div class="card">
    <h1>🎓 Teacher Portal</h1>
    <p class="subtitle">Create classes, manage exams, and track student progress</p>

    <div class="sections">
        <div class="panel active" onclick="switchTab('login')">
            <h2><i class="fa-solid fa-sign-in-alt"></i> Login</h2>
            <p class="section-subtitle">Access your account</p>
        </div>
        <div class="panel" onclick="switchTab('register')">
            <h2><i class="fa-solid fa-user-plus"></i> Register</h2>
            <p class="section-subtitle">Create new account</p>
        </div>
    </div>

    <!-- Login Form -->
    <div id="loginTab">
        <div class="error-msg" id="loginError"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <label>
                Email Address
                <input type="email" id="loginEmail" placeholder="your@email.com" required />
            </label>
            <label>
                Password
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </label>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-sign-in-alt"></i> Login
            </button>
        </form>
    </div>

    <!-- Register Form -->
    <div id="registerTab" class="hidden">
        <div class="error-msg" id="registerError"></div>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>
                    Full Name
                    <input type="text" id="regName" placeholder="Your name" required />
                </label>
                <label>
                    Email Address
                    <input type="email" id="regEmail" placeholder="your@email.com" required />
                </label>
            </div>

            <div class="form-group">
                <label>
                    Password
                    <input type="password" id="regPassword" placeholder="Min. 8 characters" required />
                </label>
                <label>
                    Confirm Password
                    <input type="password" id="regConfirm" placeholder="Confirm password" required />
                </label>
            </div>

            <div class="form-group full">
                <label>
                    Specialization / Subject
                    <input type="text" id="regSubject" placeholder="e.g., Mathematics, Physics, English" />
                </label>
            </div>

            <div class="form-group full">
                <label>
                    Qualifications
                    <input type="text" id="regQualification" placeholder="e.g., B.Tech, M.Sc" />
                </label>
            </div>

            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>
    </div>

    <div class="footer">
        Student? <a href="../student/student.html">Login here</a>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.getElementById('loginTab').classList.add('hidden');
        document.getElementById('registerTab').classList.add('hidden');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

        if (tab === 'login') {
            document.getElementById('loginTab').classList.remove('hidden');
            document.querySelectorAll('.panel')[0].classList.add('active');
        } else {
            document.getElementById('registerTab').classList.remove('hidden');
            document.querySelectorAll('.panel')[1].classList.add('active');
        }
    }

    function showError(elementId, message) {
        const errorEl = document.getElementById(elementId);
        errorEl.textContent = message;
        errorEl.classList.add('show');
        setTimeout(() => errorEl.classList.remove('show'), 5000);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        document.getElementById('loginError').classList.remove('show');
        ExamUtils.showLoader('Logging in...');

        try {
            const result = await authService.login(email, password, 'teacher');
            if (!result.success) {
                ExamUtils.hideLoader();
                showError('loginError', result.error);
                return;
            }

            const role = await authService.getUserRole();
            ExamUtils.hideLoader();

            if (role !== 'teacher') {
                showError('loginError', 'This account is not a teacher account');
                return;
            }

            ExamUtils.showToast('Login successful!', 'success');
            setTimeout(() => {
                window.location.href = 'teacher-dashboard.html';
            }, 500);
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Login error:', error);
            showError('loginError', error.message || 'Login failed');
        }
    }

    async function handleRegister(e) {
        e.preventDefault();

        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;

        document.getElementById('registerError').classList.remove('show');

        if (password !== confirm) {
            showError('registerError', 'Passwords do not match');
            return;
        }

        if (password.length < 8) {
            showError('registerError', 'Password must be at least 8 characters');
            return;
        }

        ExamUtils.showLoader('Creating account...');

        try {
            const result = await authService.signup(email, password, name, 'teacher');
            if (!result.success) {
                ExamUtils.hideLoader();
                showError('registerError', result.error);
                return;
            }

            ExamUtils.hideLoader();
            ExamUtils.showToast('Account created! Please verify your email.', 'success');
            
            setTimeout(() => {
                document.getElementById('registerForm').reset();
                switchTab('login');
                document.getElementById('loginEmail').value = email;
            }, 1000);
        } catch (error) {
            ExamUtils.hideLoader();
            console.error('Register error:', error);
            showError('registerError', error.message || 'Registration failed');
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            if (await authService.isAuthenticated()) {
                const role = await authService.getUserRole();
                if (role === 'teacher') {
                    window.location.href = 'teacher-dashboard.html';
                } else if (role === 'student') {
                    window.location.href = '../student/studenthome.html';
                }
            }
        } catch (error) {
            console.error('Auth check error:', error);
        }
    });
</script>

</body>
</html>
